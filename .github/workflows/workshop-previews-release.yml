name: Publish verified lightweight workshop previews
on:
  push:
    branches: [main]
    paths: ['tools/package_workshop_previews.py', 'tools/dice_geometry_preview.py', 'sources/dice-preview-geometry-v1.json', 'sources/dice-native-render-v1.json', '.github/workflows/workshop-previews-release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: workshop-previews-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow==11.3.0
      - run: |
          if [[ -f sources/dice-native-render-v1.json ]]; then python tools/package_workshop_previews.py --native-dice; else python tools/package_workshop_previews.py; fi
      - name: Publish immutable previews and verify public bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view workshop-previews-v1 >/dev/null 2>&1 || gh release create workshop-previews-v1 --latest=false --title 'Workshop lightweight previews v1' --notes 'Small derived previews of published owner-authorized images, map layouts, procedural surfaces and geometric objects. Original authorship/licenses and source SHA-256 retained in preview-index.json. Maps/models use clearly labeled schematics.'
          python - <<'PY'
          import json,subprocess,hashlib,urllib.request
          from pathlib import Path
          folder=Path('dist/workshop-previews-v1')
          known={a['name'] for a in json.loads(subprocess.check_output(['gh','release','view','workshop-previews-v1','--json','assets']))['assets']}
          for path in sorted(folder.glob('*')):
              if path.name not in known:subprocess.run(['gh','release','upload','workshop-previews-v1',str(path)],check=True)
          index=next(folder/f'preview-index-v{v}.json' for v in [8,7,6,5] if (folder/f'preview-index-v{v}.json').exists())
          for item in json.loads(index.read_text())['previews']:
              data=urllib.request.urlopen(item['url'],timeout=90).read()
              assert len(data)==item['bytes'] and hashlib.sha256(data).hexdigest()==item['sha256']
          print('PUBLIC_WORKSHOP_PREVIEWS_SHA_PASS')
          PY
      - name: Activate matching catalog after verification (preserve older clients)
        run: |
          if [[ -f dist/workshop-previews-v1/preview-index-v8.json ]]; then catalog_version=v8; elif [[ -f dist/workshop-previews-v1/preview-index-v7.json ]]; then catalog_version=v7; elif [[ -f dist/workshop-previews-v1/preview-index-v6.json ]]; then catalog_version=v6; else catalog_version=v5; fi
          mkdir -p "catalog/$catalog_version"
          cp dist/workshop-previews-v1/index.json "catalog/$catalog_version/index.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "catalog/$catalog_version/index.json"
          git commit -m "Activate SHA-verified graphical previews catalog $catalog_version" || exit 0
          git push origin HEAD:main
