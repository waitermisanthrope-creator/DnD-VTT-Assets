name: Publish verified CC0 source archive
on:
  push:
    branches: [main]
    paths: ['migration/reviewed-source-release.json', 'tools/package_reviewed_sources.py', '.github/workflows/reviewed-source-release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/package_reviewed_sources.py
      - name: Publish source archive after exact byte and SHA-256 verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create makehuman-cc0-skins-v1 dist/makehuman-cc0-skins-v1.zip dist/SHA256SUMS.txt dist/release-manifest.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'MakeHuman CC0 skin sources v1' --notes 'Verified byte-for-byte CC0 source textures and original license/author metadata. Source archive only; not a Unity AssetBundle. Original application files remain untouched.'
